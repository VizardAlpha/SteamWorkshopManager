name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test SteamWorkshopManager.Tests/SteamWorkshopManager.Tests.csproj -c Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: windows
          - os: macos-latest
            rid: osx-x64
            artifact: macos
          - os: ubuntu-latest
            rid: linux-x64
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        env:
          SWM_TELEMETRY_URL: ${{ secrets.SWM_TELEMETRY_URL }}
          SWM_DISCORD_APP_ID: ${{ secrets.SWM_DISCORD_APP_ID }}
        run: dotnet publish SteamWorkshopManager/SteamWorkshopManager.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:DebugType=None -p:DebugSymbols=false -o dist

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/* -DestinationPath SteamWorkshopManager-${{ matrix.artifact }}.zip
        shell: pwsh

      # Zip from inside dist/ so the archive root matches Windows (no "dist/" prefix).
      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: cd dist && zip -r ../SteamWorkshopManager-${{ matrix.artifact }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SteamWorkshopManager-${{ matrix.artifact }}
          path: SteamWorkshopManager-${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # The in-app updater refuses to install a package missing from this file.
      - name: Compute checksums
        run: |
          cd artifacts
          find . -name '*.zip' -exec mv {} . \;
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          # v1.9.0-beta.1, v2.0.0-alpha.2, ...: never offered to stable-channel users.
          prerelease: ${{ contains(github.ref_name, '-') }}
