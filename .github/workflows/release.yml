name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test WorkshopManager.Tests/WorkshopManager.Tests.csproj -c Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: windows
          - os: macos-latest
            rid: osx-x64
            artifact: macos
          - os: ubuntu-latest
            rid: linux-x64
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        env:
          SWM_TELEMETRY_URL: ${{ secrets.SWM_TELEMETRY_URL }}
          SWM_DISCORD_APP_ID: ${{ secrets.SWM_DISCORD_APP_ID }}
        run: dotnet publish WorkshopManager/WorkshopManager.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:DebugType=None -p:DebugSymbols=false -o dist

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/* -DestinationPath WorkshopManager-${{ matrix.artifact }}.zip
        shell: pwsh

      # Zip from inside dist/ so the archive root matches Windows (no "dist/" prefix).
      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: cd dist && zip -r ../WorkshopManager-${{ matrix.artifact }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkshopManager-${{ matrix.artifact }}
          path: WorkshopManager-${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # The in-app updater refuses to install a package missing from this file.
      - name: Compute checksums
        run: |
          cd artifacts
          find . -name '*.zip' -exec mv {} . \;
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          # v1.9.0-beta.1, v2.0.0-alpha.2, ...: never offered to stable-channel users.
          prerelease: ${{ contains(github.ref_name, '-') }}
